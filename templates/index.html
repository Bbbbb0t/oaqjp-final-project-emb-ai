<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion Detector</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1rem; color: #17202a; }
    textarea { width: 100%; min-height: 130px; padding: .75rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .7rem 1rem; cursor: pointer; }
    #result { margin-top: 1.5rem; padding: 1rem; background: #f2f4f7; white-space: pre-wrap; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <h1>Customer Feedback Emotion Detector</h1>
  <p>Enter feedback to identify its strongest emotion.</p>
  <form id="emotion-form">
    <label for="text">Feedback</label>
    <textarea id="text" required placeholder="I love the quality of this product!"></textarea>
    <button type="submit">Analyze emotion</button>
  </form>
  <div id="result" role="status" aria-live="polite"></div>
  <script>
    const form = document.getElementById('emotion-form');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.className = '';
      result.textContent = 'Analyzing…';
      try {
        const response = await fetch('/emotionDetector', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({text: document.getElementById('text').value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed');
        result.textContent = `Dominant emotion: ${data.dominant_emotion}\n\n` +
          Object.entries(data).filter(([key]) => key !== 'dominant_emotion')
            .map(([key, value]) => `${key}: ${Number(value).toFixed(4)}`).join('\n');
      } catch (error) {
        result.className = 'error';
        result.textContent = error.message;
      }
    });
  </script>
</body>
</html>
